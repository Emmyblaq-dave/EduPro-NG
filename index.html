<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EduPro-NG</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  color: #172033;
}

header {
  background: #0b6b3a;
  color: white;
  padding: 18px 16px;
}

.logo {
  font-size: 25px;
  font-weight: bold;
}

.tag {
  margin-top: 5px;
  font-size: 13px;
}

main {
  max-width: 1000px;
  margin: auto;
  padding: 18px;
}

.hero {
  background: #0b6b3a;
  color: white;
  border-radius: 20px;
  padding: 25px 18px;
  margin-bottom: 22px;
}

.hero h1 {
  margin-top: 0;
  font-size: 30px;
}

.hero p {
  line-height: 1.5;
}

.btn {
  border: none;
  border-radius: 12px;
  padding: 12px 17px;
  font-weight: bold;
  cursor: pointer;
}

.btn-light {
  background: white;
  color: #0b6b3a;
}

.section-title {
  margin-top: 25px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 12px;
}

.card {
  background: white;
  border-radius: 16px;
  padding: 16px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.07);
}

.icon {
  font-size: 28px;
}

.card h3 {
  margin: 8px 0 5px;
  font-size: 17px;
}

.card p {
  margin: 0;
  color: #667085;
  font-size: 13px;
}

.quiz {
  background: white;
  border-radius: 18px;
  padding: 18px;
  margin-top: 18px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.07);
}

.option {
  width: 100%;
  margin: 7px 0;
  text-align: left;
  background: #f2f4f7;
  color: #172033;
}

#result {
  margin-top: 12px;
  font-weight: bold;
}

.pro {
  margin-top: 22px;
  background: #172033;
  color: white;
  border-radius: 18px;
  padding: 20px;
}

.pro strong {
  color: #ffd166;
}

footer {
  text-align: center;
  color: #667085;
  padding: 30px 10px;
  font-size: 13px;
}
</style>
</head>

<body>

<header>
  <div class="logo">📚 EduPro-NG</div>
  <div class="tag">Learn • Practice • Pass</div>
</header>

<main>

<section class="hero">
  <h1>Prepare Smarter for Nigerian Exams</h1>

  <p>
    Prepare for JAMB, WAEC, NECO, GCE and secondary school subjects
    with quizzes, lessons and difficult exam-style practice
