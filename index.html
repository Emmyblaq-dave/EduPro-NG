<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EduPro-NG</title>
<style>
:root{--bg:#061120;--card:#0c1d2f;--card2:#10263b;--line:#1d3a53;--txt:#f5f7fa;--muted:#aab9c9;--green:#39d98a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:16px Arial,sans-serif;line-height:1.6}
header{position:sticky;top:0;z-index:5;background:#071526;border-bottom:1px solid var(--line)}
nav{max-width:1100px;margin:auto;padding:15px 18px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:24px;font-weight:800;color:var(--green)}button{cursor:pointer;border:1px solid var(--line);border-radius:14px;padding:13px 16px;background:var(--card);color:var(--txt);font-weight:700}
button:hover{border-color:var(--green)}.home{background:var(--green);color:#061120;border:0}
main{max-width:1100px;margin:auto;padding:25px 18px 70px}h1{font-size:36px;line-height:1.15}h2{font-size:26px}h3{font-size:20px}
p{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}
.card{padding:20px;min-height:130px;text-align:left}.icon{font-size:34px;display:block}.small{font-size:14px;color:var(--muted)}
.search{margin:20px 0;padding:15px;background:var(--card);border:1px solid var(--line);border-radius:16px}
input{width:100%;padding:14px;background:#08182a;color:white;border:1px solid var(--line);border-radius:12px;font-size:16px}
.topic{display:flex;justify-content:space-between;align-items:center;text-align:left;width:100%;margin:9px 0}
.num{display:inline-flex;width:32px;height:32px;border-radius:50%;background:#14324a;color:var(--green);align-items:center;justify-content:center;margin-right:9px}
.lesson{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-top:18px}
.def{border-left:4px solid var(--green);background:#0b2235;padding:13px;border-radius:8px}.example{background:#091a2b;border:1px solid var(--line);padding:14px;border-radius:10px}
.formula{font-size:20px;color:var(--green);font-weight:800}.back{margin-bottom:15px}
footer{text-align:center;border-top:1px solid var(--line);padding:25px;color:var(--muted)}
@media(min-width:760px){.grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<header><nav><div class="logo">📚 EduPro-NG</div><button class="home" onclick="home()">Home</button></nav></header>
<main id="app"></main>
<footer>EduPro-NG • Nigerian digital textbooks, practice and exam preparation</footer>

<script>
/*
  IMPORTANT:
  This version does NOT force every subject to have 30 chapters.
  Each level has its own subjects, and every subject has its own natural topic list.
  Expand the topic arrays as the curriculum content is developed.
*/

const I={English:"📖","English Studies":"📖","English Language":"📖","Use of English":"📖",Mathematics:"➗","General Mathematics":"➗",Chemistry:"⚗️",Physics:"⚡",Biology:"🧬",Agriculture:"🌱","Agricultural Science":"🌱",Government:"🏛️",Economics:"💰","Home Economics":"🏠","Basic Science":"🔬","Basic Technology":"🛠️","Business Studies":"💼","Social Studies":"🌍","Civic Education":"⚖️","Computer Studies":"💻","Computer Science":"💻","Literature":"📚","Literature in English":"📚"};

const T={
Chemistry:`Matter and Measurement|Atomic Structure|Periodic Table|Chemical Bonding|Mole Concept|Chemical Formulae|Chemical Equations|Stoichiometry|Gas Laws|Acids, Bases and Salts|Redox Reactions|Electrolysis|Energy Changes|Rates of Reaction|Equilibrium|Organic Chemistry|Hydrocarbons|Alcohols|Carboxylic Acids|Polymers|Metals|Non-metals|Water|Air and Environmental Chemistry|Industrial Chemistry`.split("|"),
Physics:`Measurement|Units and Dimensions|Scalars and Vectors|Motion|Speed and Velocity|Acceleration|Distance-Time Graphs|Velocity-Time Graphs|Forces|Newton's Laws of Motion|Friction|Work|Energy|Power|Simple Machines|Pressure|Density|Heat|Temperature|Thermal Expansion|Waves|Sound|Light|Electricity|Magnetism|Electromagnetic Induction|Modern Physics`.split("|"),
Biology:`Characteristics of Living Things|Classification of Living Things|Cell Structure|Cell Organisation|Cell Division|Nutrition in Plants|Photosynthesis|Nutrition in Animals|Digestive System|Respiration|Transport in Plants|Transport in Animals|Excretion|Homeostasis|Support and Movement|Reproduction in Plants|Reproduction in Animals|Growth and Development|Genetics|Variation|Evolution|Ecology|Food Chains and Food Webs|Population Studies|Adaptation|Microorganisms|Diseases and Prevention|Biological Techniques`.split("|"),
Mathematics:`Number and Numeration|Number Bases|Fractions|Decimals|Percentages|Ratio and Proportion|Approximation|Indices|Logarithms|Surds|Algebraic Expressions|Linear Equations|Simultaneous Equations|Quadratic Equations|Inequalities|Sequences and Series|Variation|Sets|Functions|Graphs|Plane Geometry|Mensuration|Coordinate Geometry|Trigonometry|Statistics|Probability|Financial Mathematics|Calculus`.split("|"),
"General Mathematics":`Number and Numeration|Number Bases|Fractions|Decimals|Percentages|Ratio and Proportion|Approximation|Indices|Logarithms|Surds|Algebraic Expressions|Linear Equations|Simultaneous Equations|Quadratic Equations|Inequalities|Sequences and Series|Variation|Sets|Functions|Graphs|Plane Geometry|Mensuration|Coordinate Geometry|Trigonometry|Statistics|Probability|Financial Mathematics|Calculus`.split("|"),
"English Language":`Grammar and Usage|Parts of Speech|Nouns|Pronouns|Verbs|Adjectives|Adverbs|Prepositions|Conjunctions|Articles and Determiners|Tenses|Concord|Phrases|Clauses|Sentence Structure|Vocabulary Development|Synonyms and Antonyms|Idioms and Proverbs|Comprehension|Summary Writing|Descriptive Writing|Narrative Writing|Argumentative Writing|Formal Letters|Informal Letters|Report Writing|Oral English|Literature Appreciation`.split("|"),
"English Studies":`Reading Skills|Writing Skills|Listening and Speaking|Nouns|Pronouns|Verbs|Adjectives|Adverbs|Prepositions|Conjunctions|Tenses|Sentence Construction|Concord|Vocabulary Development|Comprehension|Summary|Narrative Writing|Descriptive Writing|Formal and Informal Letters|Oral English|Prose|Poetry|Drama|Figures of Speech`.split("|"),
"Use of English":`Comprehension|Cloze Tests|Lexis and Structure|Sentence Interpretation|Synonyms|Antonyms|Idioms|Oral English|Grammar|Summary Writing|Sentence Completion`.split("|"),
Government:`Meaning of Government|Functions of Government|Forms of Government|Systems of Government|Democracy|Constitution|Constitutionalism|Rule of Law|Separation of Powers|Checks and Balances|Fundamental Human Rights|Citizenship|Political Socialisation|Political Participation|Public Opinion|Political Parties|Pressure Groups|Elections|Electoral Systems|Electoral Commission|Legislature|Executive|Judiciary|Local Government|Public Administration|Civil Service|Foreign Policy|International Organisations|Nigeria's Political Development`.split("|"),
Economics:`Meaning of Economics|Basic Economic Problems|Scarcity|Choice and Opportunity Cost|Factors of Production|Land|Labour|Capital|Entrepreneurship|Division of Labour|Specialisation|Scale of Production|Demand|Supply|Price Determination|Elasticity of Demand|Elasticity of Supply|Production|Costs of Production|Revenue|Market Structures|Money|Banking|Inflation|Unemployment|National Income|Economic Growth and Development|Population|International Trade|Public Finance`.split("|"),
"Agricultural Science":`Introduction to Agriculture|Importance of Agriculture|Branches of Agriculture|Factors Affecting Agriculture|Farm Planning|Farm Records|Farm Tools|Farm Machinery|Soil|Soil Formation|Soil Properties|Soil Fertility|Water and Irrigation|Farm Pests|Farm Diseases|Weeds and Weed Control|Crop Production|Seed Selection|Planting Operations|Crop Maintenance|Harvesting|Storage of Farm Produce|Livestock Production|Animal Nutrition|Animal Health|Animal Reproduction|Fisheries|Forestry|Agricultural Economics|Agricultural Marketing`.split("|"),
"Basic Science":`Living and Non-Living Things|Measurement|Matter|The Particulate Nature of Matter|Energy|Forms of Energy|Heat|Light|Sound|Forces|Simple Machines|Air|Water|Soil|Nutrition|Human Health|Reproduction|Growth|Microorganisms|Disease Prevention|Environment|Pollution|Weather|Earth and Space`.split("|"),
"Basic Technology":`Workshop Safety|Materials|Wood|Metals|Plastics|Tools|Measuring Instruments|Drawing Instruments|Technical Drawing|Orthographic Drawing|Building Materials|Simple Structures|Machines|Levers|Pulleys|Wheels and Axles|Electrical Components|Simple Circuits|Electronics|Communication Technology`.split("|"),
"Business Studies":`Introduction to Business|Occupation|Production|Trade|Commerce|Office|Office Equipment|Communication|Transport|Banking|Insurance|Bookkeeping|Source Documents|Cash Book|Consumer Education|Entrepreneurship|Advertising|Business Ethics`.split("|"),
"Social Studies":`Family|Culture|Socialisation|Community|Institutions|Values|Cooperation|Conflict|Human Rights|Population|Environment|Resources|Transportation|Communication|National Unity|Leadership|Citizenship|Drug Abuse|Career Awareness`.split("|"),
"Civic Education":`Values|National Consciousness|Citizenship|Duties of Citizens|Human Rights|Rule of Law|Democracy|Constitution|Leadership|Followership|Community Service|National Symbols|National Unity|Peace|Conflict Resolution|Drug Abuse|Cultism|Traffic Regulations`.split("|"),
"Computer Studies":`Computer Fundamentals|Parts of a Computer|Input Devices|Output Devices|Storage Devices|Operating Systems|Files and Folders|Keyboard Skills|Word Processing|Presentation|Internet|Email|Online Safety|Digital Citizenship|Computer Ethics|Computer Networks|Algorithms|Flowcharts`.split("|"),
"Computer Science":`Computer Fundamentals|Data Representation|Logic Gates|Operating Systems|Algorithms|Flowcharts|Programming Concepts|Variables and Data Types|Control Structures|Arrays|Databases|Computer Networks|Internet|Web Technology|Cybersecurity|Computer Ethics|System Development|Artificial Intelligence Introduction`.split("|"),
"Home Economics":`Introduction to Home Economics|Areas of Home Economics|The Family|Family Relationships|Family Values|Food and Nutrition|Classes of Food|Nutrients and Their Functions|Balanced Diet|Meal Planning|Kitchen Equipment|Kitchen Utensils|Kitchen Safety|Personal Hygiene|Food Hygiene|Clothing and Textiles|Fibres and Fabrics|Clothing Construction|Sewing Tools|Basic Sewing Stitches|The Home|Household Resources|Time Management|Money Management|Consumer Education|Care of Clothing|Simple Food Preparation|Child Development|Entrepreneurship`.split("|"),
"Literature in English":`Literary Genres|Prose|Poetry|Drama|Plot|Characterisation|Setting|Theme|Style|Point of View|Figures of Speech|Diction|Tone|Mood|Conflict|Irony|Symbolism|Oral Literature|African Literature|Nigerian Literature|Literary Appreciation`.split("|")
};

const LEVELS={
"JSS1":["English Studies","Mathematics","Basic Science","Basic Technology","Agricultural Science","Business Studies","Social Studies","Civic Education","Computer Studies","Home Economics"],
"JSS2":["English Studies","Mathematics","Basic Science","Basic Technology","Agricultural Science","Business Studies","Social Studies","Civic Education","Computer Studies","Home Economics"],
"JSS3":["English Studies","Mathematics","Basic Science","Basic Technology","Agricultural Science","Business Studies","Social Studies","Civic Education","Computer Studies","Home Economics"],
"SSS1":["English Language","General Mathematics","Chemistry","Physics","Biology","Agricultural Science","Government","Economics","Literature in English","Home Economics","Computer Science"],
"SSS2":["English Language","General Mathematics","Chemistry","Physics","Biology","Agricultural Science","Government","Economics","Literature in English","Home Economics","Computer Science"],
"SSS3":["English Language","General Mathematics","Chemistry","Physics","Biology","Agricultural Science","Government","Economics","Literature in English","Home Economics","Computer Science"],
"JAMB":["Use of English","Mathematics","Chemistry","Physics","Biology","Agricultural Science","Government","Economics"],
"WAEC":["English Language","Mathematics","Chemistry","Physics","Biology","Agricultural Science","Government","Economics","Literature in English"],
"NECO":["English Language","Mathematics","Chemistry","Physics","Biology","Agricultural Science","Government","Economics"]
};

let S={view:"levels",level:"",subject:"",topic:""};

function home(){S={view:"levels",level:"",subject:"",topic:""};render()}
function level(x){S={view:"subjects",level:x,subject:"",topic:""};render()}
function subject(x){S={view:"topics",level:S.level,subject:x,topic:""};render()}
function topic(x){S={view:"lesson",level:S.level,subject:S.subject,topic:x};render()}

function levels(){
return `<h1>Learn. Practice. Pass.</h1>
<p>Choose a level. EduPro-NG now uses level-specific subjects and natural topic lists instead of forcing every subject into 30 chapters.</p>
<div class="grid">${Object.keys(LEVELS).map(x=>`<button class="card" onclick="level('${safe(x)}')"><span class="icon">${x.startsWith("JSS")?"🎒":x.startsWith("SSS")?"🏫":"🎯"}</span><b>${x}</b><div class="small">${LEVELS[x].length} subjects</div></button>`).join("")}</div>
<div class="search"><b>Search</b><input placeholder="Search a subject or topic..." oninput="search(this.value)"><div id="results"></div></div>`;
}
function subjects(){
let a=LEVELS[S.level];
return `<div class="back"><button onclick="home()">← Levels</button></div><h1>${S.level} Textbooks</h1><p>Select a subject. Each subject has its own topic count.</p>
<div class="grid">${a.map(x=>`<button class="card" onclick="subject('${safe(x)}')"><span class="icon">${I[x]||"📘"}</span><b>${x}</b><div class="small">${(T[x]||[]).length} topics</div></button>`).join("")}</div>`;
}
function topics(){
let a=T[S.subject]||[];
return `<div class="back"><button onclick="level('${safe(S.level)}')">← Subjects</button></div><h1>${S.subject}</h1><p>${a.length} topics</p>
${a.map((x,i)=>`<button class="topic" onclick="topic('${safe(x)}')"><span><span class="num">${i+1}</span>${x}</span><span>›</span></button>`).join("")}`;
}
function lesson(){
let t=S.topic,s=S.subject;
let c=content(s,t);
return `<div class="back"><button onclick="subject('${safe(s)}')">← Topics</button></div>
<div class="lesson"><div class="small">${S.level} • ${s}</div><h1>${t}</h1>
<div class="def"><b>Definition / Core idea</b><p>${c.def}</p></div>
<h2>Introduction</h2><p>${c.intro}</p>
<h2>Main areas</h2><ul>${c.points.map(x=>`<li>${x}</li>`).join("")}</ul>
${c.formula?`<h2>Formula / Method</h2><div class="formula">${c.formula}</div>`:""}
<h2>Worked example</h2><div class="example">${c.example}</div>
<h2>Key points</h2><ul>${c.keys.map(x=>`<li>${x}</li>`).join("")}</ul>
<h2>Practice</h2><p>Answer questions from this topic using the definition, examples, rules, formulae and applications studied above.</p>
</div>`;
}
function content(s,t){
let def=`${t} is an important area of ${s}. It should be studied through its meaning, major principles, examples, applications and examination questions.`;
let intro=`Begin with the standard meaning of the topic, identify its major parts, study the examples, and then practise applying the knowledge to questions.`;
let points=[`Know the standard terms used in ${t}.`,`Understand the main principles and relationships.`,`Study relevant examples and applications.`,`Practise questions that require the knowledge from this topic.`];
let formula="",example=`A good answer on ${t} should state the relevant idea clearly, explain the required points and use an appropriate example where necessary.`,keys=[`Use correct subject terminology.`,`Read the command word carefully: define, state, explain, calculate, compare or discuss.`,`Revise the examples after studying the explanation.`];

if(s==="Chemistry"){
def=`${t} deals with the composition, properties, reactions or applications of substances and the chemical principles used to explain them.`;
points=[`Learn the chemical terms, symbols and observations connected with the topic.`,`Distinguish substances, processes and chemical changes carefully.`,`Use correct formulae and equations where required.`,`Apply calculations with correct units when the topic involves numerical work.`];
if(t==="Mole Concept"){formula="n = m ÷ M";example="For a substance of mass 18 g and molar mass 18 g mol⁻¹: n = 18 ÷ 18 = 1 mol."}
else if(t==="Gas Laws"){formula="P₁V₁/T₁ = P₂V₂/T₂";example="For a fixed amount of gas, pressure, volume and absolute temperature are related. Temperature is converted to kelvin for this relationship."}
else if(t==="Stoichiometry"){formula="Use the balanced equation to obtain mole ratios.";example="2H₂ + O₂ → 2H₂O shows a 2:1:2 mole relationship between hydrogen, oxygen and water."}
else if(t==="Chemical Formulae"){formula="Balance valencies/oxidation states to obtain the simplest whole-number ratio.";example="Magnesium has valency 2 and chlorine has valency 1, so magnesium chloride is MgCl₂."}
}
if(s==="Physics"){
def=`${t} is a physics concept used to describe, measure or explain physical phenomena.`;
points=[`Identify the physical quantities involved.`,`Use consistent SI units.`,`Choose the relationship or law appropriate to the question.`,`Check the final unit and whether the answer is reasonable.`];
if(t==="Speed and Velocity"||t==="Motion"){formula="speed = distance ÷ time";example="A body travels 120 m in 10 s: speed = 120 ÷ 10 = 12 m/s."}
else if(t==="Acceleration"){formula="a = (v − u) ÷ t";example="If velocity changes from 5 m/s to 20 m/s in 3 s: a = (20 − 5) ÷ 3 = 5 m/s²."}
else if(t==="Work"){formula="W = F × d";example="A 20 N force moves an object 5 m in its direction: W = 20 × 5 = 100 J."}
else if(t==="Power"){formula="P = W ÷ t";example="600 J of work completed in 20 s gives P = 600 ÷ 20 = 30 W."}
}
if(s==="Mathematics"||s==="General Mathematics"){
def=`${t} is a mathematical area requiring the correct rules, operations and reasoning to solve problems accurately.`;
points=[`Identify the quantities or expressions given.`,`Select the appropriate rule, formula or method.`,`Show the working step by step.`,`Check arithmetic, signs, units and the final result.`];
if(t==="Percentage"){formula="Percentage = (part ÷ whole) × 100";example="20 out of 80 = (20 ÷ 80) × 100 = 25%."}
else if(t==="Speed"){formula="Speed = distance ÷ time";example="120 m ÷ 10 s = 12 m/s."}
else if(t==="Simple Interest"){formula="I = PRT/100";example="For ₦10,000 at 5% for 2 years: I = 10,000×5×2/100 = ₦1,000."}
}
return {def,intro,points,formula,example,keys};
}
function search(q){
let r=document.getElementById("results");q=q.toLowerCase().trim();if(!q){r.innerHTML="";return}
let a=[];
for(let l in LEVELS)for(let s of LEVELS[l]){if(s.toLowerCase().includes(q))a.push(`<button class="topic" onclick="level('${safe(l)}');setTimeout(()=>subject('${safe(s)}'),0)">${l} — ${s}</button>`);for(let t of (T[s]||[]))if(t.toLowerCase().includes(q))a.push(`<button class="topic" onclick="level('${safe(l)}');setTimeout(()=>{subject('${safe(s)}');setTimeout(()=>topic('${safe(t)}'),0)},0)">${l} — ${s} — ${t}</button>`)}
r.innerHTML=a.slice(0,20).join("")||"<p>No result found.</p>";
}
function safe(x){return String(x).replace(/\/g,"\\").replace(/'/g,"\'")}
function render(){document.getElementById("app").innerHTML=S.view==="levels"?levels():S.view==="subjects"?subjects():S.view==="topics"?topics():lesson();scrollTo(0,0)}
render();
</script>
</body>
</html>
